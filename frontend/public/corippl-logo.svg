<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" width="280" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;500&amp;display=swap');
    </style>
  </defs>
  
  <!-- White background -->
  <rect x="0" y="0" width="280" height="100" fill="#ffffff"/>
  
  <!-- "Co" with dark background -->
  <rect x="10" y="25" width="68" height="50" rx="6" fill="#2d2c29"/>
  <text x="44" y="62" font-family="'IBM Plex Mono', monospace" font-size="32" font-weight="500" fill="#ffffff" text-anchor="middle" letter-spacing="-0.05em">Co</text>
  
  <!-- "Rippl" in light weight -->
  <text x="90" y="62" font-family="'IBM Plex Mono', monospace" font-size="32" font-weight="300" fill="#2d2c29" letter-spacing="-0.05em">Rippl</text>
</svg>
